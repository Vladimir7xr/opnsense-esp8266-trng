[start]
command:/usr/local/etc/rc.syshook.d/start/90-esp-trng
parameters:
type:script
message:Starting ESP8266 Hardware TRNG feeder

[stop]
command:/usr/local/etc/rc.syshook.d/stop/90-esp-trng
parameters:
type:script
message:Stopping ESP8266 Hardware TRNG feeder

[restart]
command:/usr/local/etc/rc.syshook.d/stop/90-esp-trng && /usr/local/etc/rc.syshook.d/start/90-esp-trng
parameters:
type:script
message:Restarting ESP8266 Hardware TRNG feeder

[status]
command:pgrep -F /var/run/esp-trng-feeder.pid >/dev/null 2>&1 && echo "esp_trng is running" || echo "esp_trng is stopped"
parameters:
type:script_output
message:Checking ESP8266 Hardware TRNG status

[daemon]
command:/usr/local/etc/rc.syshook.d/start/90-esp-trng
type:daemon
pidfile:/var/run/esp-trng-feeder.pid
description:ESP8266 Hardware TRNG