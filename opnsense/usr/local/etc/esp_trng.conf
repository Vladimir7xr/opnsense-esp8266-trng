attach 100 {
    device-name "uslcom[0-9]+";
    match "vendor" "0x10c4";
    match "product" "0xea60";
    action "ln -sf /dev/cua$ttyname /dev/trng_esp";
};

detach 100 {
    device-name "uslcom[0-9]+";
    match "vendor" "0x10c4";
    match "product" "0xea60";
    action "rm -f /dev/trng_esp";
};